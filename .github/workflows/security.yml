name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The engine's dependencies change without us touching this repo, so scan
    # on a schedule as well as on push.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  # Vendor mode does not consult go.sum, so the sha256 values in go.mod.yml are
  # what actually protects the build. Re-checking them against the module proxy
  # from a clean slate catches a hash that was hand-edited or generated from a
  # tampered local module cache.
  declared-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Every module matches its declared sha256
        run: ./scripts/verify-engine-sources.sh

      - name: The engine tag still points at the pinned commit
        run: |
          set -euo pipefail
          source scripts/lib.sh
          tag=$(engine_tag)
          pinned=$(engine_commit)
          actual=$(git ls-remote "$ENGINE_URL" "refs/tags/${tag}^{}" | cut -f1)
          [ -n "$actual" ] || actual=$(git ls-remote "$ENGINE_URL" "refs/tags/${tag}" | cut -f1)
          echo "manifest pins $pinned; upstream $tag is $actual"
          if [ "$actual" != "$pinned" ]; then
            echo "::error::upstream tag $tag has moved — the pin protected us, investigate before bumping"
            exit 1
          fi
        shell: bash

      - name: No prebuilt binaries are committed
        run: |
          # Everything must be built from source; a committed ELF would mean a
          # binary slipped into the tree.
          if git ls-files -z | xargs -0 file --mime-type \
              | grep -E 'application/x-(executable|sharedlib)'; then
            echo "::error::committed binary found"
            exit 1
          fi

      - name: No upstream source is vendored into this repo
        run: |
          # The whole point of go.mod.yml is that we carry hashes, not code.
          if git ls-files | grep -E '^vendor/'; then
            echo "::error::upstream source committed under vendor/"
            exit 1
          fi

  engine-vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: false

      # Checks out the pinned commit; unlike the Flatpak build this may fetch
      # from the network, which is fine for a scanner.
      - name: Check out the pinned engine
        run: |
          set -euo pipefail
          source scripts/lib.sh
          clone_engine_at_pin "$PWD/.work/engine-scan"
        shell: bash

      - name: govulncheck
        working-directory: .work/engine-scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" -mode=source ./...

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
