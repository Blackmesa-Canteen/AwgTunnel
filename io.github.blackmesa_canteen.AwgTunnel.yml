id: io.github.blackmesa_canteen.AwgTunnel
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: awg-tunnel

# Every permission here is load-bearing; see README.md for the rationale.
# Notably absent: any --filesystem (profile import uses the file chooser
# portal), any --device beyond the GPU, and any system bus access. The tunnel
# runs in userspace, so no privileged host component is involved.
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.secrets

cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/man
  - '*.a'
  - '*.la'

modules:
  - name: awg-tunnel-engine
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/golang/bin
      env:
        # Vendored modules only, and never fetch a toolchain: the build has no
        # network access and must not silently acquire one.
        GOFLAGS: -mod=vendor -trimpath
        GOTOOLCHAIN: local
        CGO_ENABLED: '0'
        GOPATH: /run/build/awg-tunnel-engine/.gopath
        GOCACHE: /run/build/awg-tunnel-engine/.gocache
    build-commands:
      # Same ldflags upstream's Makefile uses, so `--version` reports the real
      # tag instead of a "-dev" placeholder in bug reports and the log view.
      # scripts/update-engine.sh keeps the version in step with the pin below,
      # and tests/test_manifest_policy.py fails if the two ever disagree.
      - go build -ldflags="-s -w -X main.version=v1.0.18" -o awg-tunnel-engine ./cmd/wireproxy
      - install -Dm755 awg-tunnel-engine /app/bin/awg-tunnel-engine
      - install -Dm644 LICENSE /app/share/licenses/wireproxy-awg/LICENSE
    sources:
      # Unmodified upstream, pinned by commit as well as tag so that a moved
      # tag cannot change what gets built. No engine source lives in this repo.
      - type: git
        url: https://github.com/artem-russkikh/wireproxy-awg.git
        tag: v1.0.18
        commit: 84f4795ea76f9c3168a61e478d0fe0e5c3238308
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$

      # Upstream does not vendor, so its 15 Go modules are declared as
      # sha256-pinned archives that rebuild the vendor/ tree. Regenerate with
      # scripts/update-engine.sh; verify with scripts/verify-engine-sources.sh.
      - go.mod.yml

  - name: awg-tunnel
    buildsystem: meson
    sources:
      - type: dir
        path: .
        skip:
          - .flatpak-builder
          - .git
          - .github
          - .work
          - build
          - builddir
          - repo
          - vendor
          - go.mod.yml
          - modules.txt
